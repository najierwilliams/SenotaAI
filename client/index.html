<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>
      SenotaAI — Autonomous Agent Console
    </title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

    <script type="module">
      const analyticsEndpoint =
        "%VITE_ANALYTICS_ENDPOINT%";

      const analyticsWebsiteId =
        "%VITE_ANALYTICS_WEBSITE_ID%";

      const endpointIsConfigured =
        analyticsEndpoint &&
        !analyticsEndpoint.startsWith("%") &&
        analyticsEndpoint.trim() !== "";

      const websiteIdIsConfigured =
        analyticsWebsiteId &&
        !analyticsWebsiteId.startsWith("%") &&
        analyticsWebsiteId.trim() !== "";

      if (
        endpointIsConfigured &&
        websiteIdIsConfigured
      ) {
        const analyticsScript =
          document.createElement("script");

        analyticsScript.defer = true;

        analyticsScript.src =
          `${analyticsEndpoint.replace(/\/+$/, "")}/umami`;

        analyticsScript.setAttribute(
          "data-website-id",
          analyticsWebsiteId,
        );

        document.head.appendChild(
          analyticsScript,
        );
      }
    </script>
  </body>
</html>
